quarkus.http.root-path=/api

#ACtivation du logger
quarkus.log.category."quest".level = DEBUG

quarkus.datasource.db-kind = postgresql
quarkus.datasource.jdbc.url = jdbc:postgresql://localhost:5432/bibliotek
quarkus.datasource.username = postgres
quarkus.datasource.password = 1234567

quarkus.hibernate-orm.database.generation = update
quarkus.hibernate-orm.log.sql = true

#CONFIG SECURITY
quarkus.http.auth.basic = true

#Securité JWT
quarkus.smallrye-jwt.enabled = true

smallrye.jwt.sign.key.location = classpath:privateKey.pem
mp.jwt.verify.issuer = bibliotek-issuer
mp.jwt.verify.publickey.location = classpath:publicKey.pem

#Durée de vie jeton (Seconde)
smallrye.jwt.new-token.lifespan = 3600

#CORS
quarkus.http.cors.enabled = true

# quarkus.http.cors.origins = http://localhost:4200
quarkus.http.cors.origins = *
# quarkus.http.cors.methods = GET, POST, PUT, DELETE
quarkus.http.cors.methods = *
# quarkus.http.cors.headers = Content-Type, Authorization
quarkus.http.cors.headers = *